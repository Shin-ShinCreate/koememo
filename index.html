<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="こえメモ">
  <title>こえメモ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>こえメモ</h1>
      <span id="syncStatus" class="sync-status" title="同期の状態">ローカル</span>
      <button id="menuBtn" class="icon-btn" aria-label="メニュー">⋯</button>
    </div>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="あいまい検索（表記ゆれ・打ち間違いOK）" autocomplete="off">
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="memos" role="tab">メモ</button>
      <button class="tab" data-view="todos" role="tab">ToDo <span id="todoCount" class="badge" hidden></span></button>
      <button class="tab" data-view="money" role="tab">家計</button>
    </nav>
  </header>

  <main id="main">
    <section id="memosView"></section>
    <section id="todosView" hidden></section>
    <section id="moneyView" hidden></section>
  </main>

  <footer class="composer">
    <div id="interim" class="interim" hidden></div>
    <div class="composer-row">
      <button id="photoBtn" class="receipt-btn" aria-label="写真から記録" title="写真から記録">📷</button>
      <input id="photoInput" type="file" accept="image/*" hidden>
      <textarea id="compose" rows="1" placeholder="メモを入力"></textarea>
      <button id="saveBtn" class="save-btn" aria-label="保存">保存</button>
      <button id="micBtn" class="mic-btn" aria-label="音声入力">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
    </div>
  </footer>

  <!-- メニュー -->
  <dialog id="menuDialog">
    <form method="dialog" class="sheet">
      <h2>メニュー</h2>
      <div id="accountBox"></div>
      <h3>エクスポート</h3>
      <div class="btn-row">
        <button type="button" data-export="md">Markdown</button>
        <button type="button" data-export="csv">CSV</button>
        <button type="button" data-export="json">JSON</button>
      </div>
      <h3>表示</h3>
      <div class="size-row" role="group" aria-label="メモの文字の大きさ">
        <span class="size-label">文字の大きさ</span>
        <div class="seg" id="fontSizeSeg">
          <button type="button" data-scale="0.85">小</button>
          <button type="button" data-scale="1">標準</button>
          <button type="button" data-scale="1.2">大</button>
          <button type="button" data-scale="1.4">特大</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="autoSaveVoice"> 録音を止めたら自動で保存する</label>
      <div class="btn-row end"><button value="close">閉じる</button></div>
    </form>
  </dialog>

  <!-- 編集 -->
  <dialog id="editDialog">
    <form method="dialog" class="sheet">
      <h2>メモを編集</h2>
      <p id="editMeta" class="muted"></p>
      <textarea id="editText" rows="8"></textarea>
      <div class="btn-row">
        <button type="button" id="editDelete" class="danger">削除</button>
        <span class="spacer"></span>
        <button value="cancel">キャンセル</button>
        <button type="button" id="editSave" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- AI との会話 -->
  <dialog id="chatDialog" class="chat-dialog">
    <div class="sheet chat">
      <div class="chat-head">
        <h2>💬 AIと会話</h2>
        <button type="button" id="chatClose" class="icon-btn" aria-label="閉じる">✕</button>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <div class="chat-input">
        <textarea id="chatText" rows="1" placeholder="続けて質問"></textarea>
        <button type="button" id="chatMic" class="mic-btn small" aria-label="音声入力">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        </button>
        <button type="button" id="chatSend" class="primary-btn">送信</button>
      </div>
    </div>
  </dialog>

  <!-- カレンダーに追加 -->
  <dialog id="calDialog">
    <form method="dialog" class="sheet">
      <h2>📅 カレンダーに追加</h2>
      <p id="calTitle" class="muted"></p>
      <button type="button" class="choice" data-cal="google">
        <span class="choice-icon">🗓️</span>
        <span><b>Googleカレンダーに追加</b><small>内容が入った予定の画面が開きます。「保存」を押すだけ</small></span>
      </button>
      <button type="button" class="choice" data-cal="ics">
        <span class="choice-icon">📆</span>
        <span><b>iPhoneのカレンダーに追加</b><small>Safariが開き「カレンダーの予定を追加」の画面になります（パソコンではOutlookなど）</small></span>
      </button>
      <div class="btn-row end"><button value="cancel">キャンセル</button></div>
    </form>
  </dialog>

  <!-- 写真から記録 -->
  <dialog id="photoDialog">
    <form method="dialog" class="sheet">
      <h2>写真から記録</h2>
      <button type="button" class="choice" data-photo="ocr">
        <span class="choice-icon">📝</span>
        <span><b>写真の文字をメモにする</b><small>手書きメモ・ホワイトボード・書類・張り紙など</small></span>
      </button>
      <button type="button" class="choice" data-photo="receipt">
        <span class="choice-icon">🧾</span>
        <span><b>レシートを記録</b><small>お店・品目・金額を読み取り、家計に入れる</small></span>
      </button>
      <p class="muted">写真そのものは保存しません。読み取った文字だけを残します。</p>
      <div class="btn-row end"><button value="cancel">キャンセル</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
